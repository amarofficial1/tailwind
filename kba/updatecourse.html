<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Updatecourse</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="m-0">
    <form action="">
    <div class="bg-violet-200 flex justify-between items-center">
        <img src="kbalogo.png" alt="kba logo" class="size-9 m-2">
        <div class="flex text-purple-700  font-medium">
        <li class="list-none"><a href="" class="px-2 hover:text-red-600">Home</a></li>
        <li class="list-none"><a href="" class="px-2  hover:text-red-600">Courses</a></li>
        <li class="list-none"><a href="" class="px-2  hover:text-red-600">Contact Us</a></li>
        <li class="list-none"><a href="./addcourse.html" class="px-2  hover:text-red-600">Add Course</a></li>
        <li class="list-none"><a href="./login.html" class="px-2  hover:text-red-600">Logout</a></li>
        </div>
    </div>
    <div class="w-130 bg-purple-200 mx-auto my-2 p-10 rounded-xl shadow-xl">
        <div class="font-black text-center text-3xl mb-7 text-purple-700">Update Course</div>
        <div class="font-bold ">Course Name</div>
        <input type="text" required class="bg-white border-2 border-slate-200 w-full my-3 p-2 rounded-sm shadow-sm">
        <div class="font-bold ">Course Type</div>
        <select name="coursetype" required class=" bg-slate-200 border-2 border-slate-200 w-full my-3 p-2 rounded-sm shadow-sm">
            <option value="hybrid">Hybrid</option>
            <option value="solo">Solo</option>
        </select>
        <div class="font-bold">Description</div>
        <textarea cols="40" rows="5" required class=" bg-white border-2 border-slate-200 w-full my-3 p-2 rounded-sm shadow-sm"></textarea>
        <div class="font-bold ">Price</div>
        <select name="price" class=" bg-slate-200 border-2 border-slate-200 w-full my-3 p-2 rounded-sm shadow-sm">
            <option value="15000">Rs.15000</option>
            <option value="20000">Rs.20000</option>
            <option value="30000">Rs.30000</option>

        </select>

        <div class="my-3 text-purple-500 font-medium">
            <input type="submit" value="Update Course" class="w-full border-2 border-purple-500 bg-purple-500 p-1 rounded-xl text-white hover:bg-purple-600">
        </div>
        
    </div>
</form>
</body>
</html>
