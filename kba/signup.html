<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-violet-200">
<form action="">
    <div class="w-96 bg-white mx-auto my-20 p-10 rounded-xl shadow-xl">
        <div class="font-extrabold text-center text-3xl mb-7 text-purple-500">Sign Up</div>
        <div class="font-bold ">Name:</div>
        <input type="text" required class="border-2 border-slate-200 w-full my-3 py-2 rounded-sm shadow-sm">
        <div class="font-bold ">Email:</div>
        <input type="email" required class="border-2 border-slate-200 w-full my-3 py-2 rounded-sm shadow-sm">
        <div class="font-bold">Password:</div>
        <input type="password" required class="border-2 border-slate-200 w-full my-3 py-2 rounded-sm shadow-sm">
        <div class="font-bold ">User</div>
        <select name="user" class="border-2 border-slate-200 w-full my-3 py-2 rounded-sm shadow-sm">
            <option value="admin">admin</option>
            <option value="user">user</option>
        </select>
        <div class="my-3 text-purple-500 font-medium">
            <input type="submit" value="Sign up" class="border-2 border-purple-500 bg-purple-500 px-3 py-1 rounded-sm text-white hover:bg-purple-600">
        </div>
        <div class="text-center font-semibold">
            Already have an account?&nbsp;<a href="./login.html" class="text-purple-500 hover:text-red-600">Login</a>
        </div>
    </div>
</form>  
</body>
</html>
