<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-violet-200">
<form action="">
    <div class="w-96 bg-white mx-auto my-40 p-10 rounded-xl shadow-xl">
        <div class="font-extrabold text-center text-3xl mb-7 text-purple-500">Login</div>
        <div class="font-bold ">Email:</div>
        <input type="email" required class="border-2 border-slate-200 w-full my-3 py-2 rounded-sm shadow-sm">
        <div class="font-bold">Password:</div>
        <input type="password" required class="border-2 border-slate-200 w-full my-3 py-2 rounded-sm shadow-sm">
        <div class="flex justify-between my-3 text-purple-500 font-medium">
            <input type="submit" value="Login" class="border-2 border-purple-500 bg-purple-500 px-3 py-1 rounded-sm text-white hover:bg-purple-600">
            Forgot Password?
        </div>
        <div class="text-center font-semibold">
            Don't have an account?&nbsp;<a href="" class="text-purple-500 hover:text-red-600">Sign up</a>
        </div>
    </div>
</form>
</body>
</html>
