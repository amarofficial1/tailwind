<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Certificate</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="my-0 mx-2">
    <form action="view certificate.html">
    <div class="flex justify-between">
        <h1 class="font-bold text-3xl mt-3">Certificate Dapp</h1>
        <div class="flex">
        <li class="list-none p-2"><a href="./homepage.html" class="hover:text-red-600">Home</a></li>
        <li class="list-none p-2 bg-blue-500 rounded-b-sm text-white"><a href="issue certificate.html" class="hover:text-red-600">Issue Certificate</a></li>
        </div>
    </div>
    <div class="w-270 pt-15 pl-15 border-1 border-slate-300 mx-auto my-20 rounded-lg shadow-lg">
        <h1 class="text-3xl my-2">Issue New Certificate</h1>
        <h1 class="text-slate-500 font-semibold">Select Course *</h1>
        <select name="courses" class="w-120 border-1 p-1 mb-5 rounded-sm">
            <option value="certified blockhain associate">Certified Blockchain Associate</option>
            <option value="certified ethical hacking associate">Certified Ethical Hacking Associate</option>
            <option value="certified MERN stack associate">Certified MERN Stack Associate</option>
        </select>
        <h1 class="text-slate-500 font-semibold">Certificate ID *</h1>
        <input type="text" placeholder="Certificate ID" required class="w-120 border-1 p-1 mb-5 rounded-sm">
        <h1 class="text-slate-500 font-semibold">Candidate name *</h1>
        <input type="text" placeholder="Name" required class="w-120 border-1 p-1 mb-5 rounded-sm">
        <h1 class="text-slate-500 font-semibold">Select Grade *</h1>
        <select name="grade" class="w-120 border-1 p-1 mb-5 rounded-sm">
            <option value="S">S</option>
            <option value="A">A</option>
            <option value="B">B</option>
        </select>
        <h1 class="text-slate-500 font-semibold">Issue Date *</h1>
        <input type="date" required class="w-120 border-1 p-1 mb-5 rounded-sm"><br>
        <input type="submit" value="Issue Certificate" class="py-1 px-3 bg-cyan-400 rounded-md mb-10 hover:text-red-600">
    </div>
</form>
</body>
</html>
